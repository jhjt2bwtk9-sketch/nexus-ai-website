<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process Transaction</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
    </style>
</head>
<body>

    <div class="text-center">
        <div class="text-4xl mb-4">💸</div>
        <h2 class="text-2xl font-bold text-white mb-2">Processing Transaction...</h2>
        <p class="text-slate-400" id="debug-text">Awaiting data...</p>

        <script>
            // 1. Get the money from the address bar
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount');
            const display = document.getElementById('debug-text');

            // 2. Save it to the computer's memory
            if (amount) {
                localStorage.setItem('sessionRevenue', amount);
                localStorage.setItem('lastTransactionTime', 'Just now');
                
                display.innerHTML = `Processing Amount: <strong>$${amount}</strong>`;
                
                // 3. Wait 2 seconds, then send user to Admin Dashboard
                // This guarantees the info is saved before they move on
                setTimeout(() => {
                    window.location.href = "details.html";
                }, 2000);
            } else {
                display.innerHTML = "Error: No amount found in URL."
            }
        </script>
    </div>

</body>
</html>
