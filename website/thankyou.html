<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Processing Payment...</title>
    <meta http-equiv="refresh" content="0;url=details.html" />
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; }
        .loader { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #6366f1; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div style="text-align: center">
        <div class="loader" style="margin: 0 auto 20px;"></div>
        <h2>Processing Transaction...</h2>
        <p>Redirecting to Admin Dashboard</p>

        <!-- THE MAGIC CODE: Saves the money to your browser storage -->
        <script>
            // Get the amount from the URL
            const urlParams = new URLSearchParams(window.location.search);
            const amount = urlParams.get('amount');

            if (amount) {
                // Save it to your browser so the Admin page can see it
                localStorage.setItem('sessionRevenue', amount);
                localStorage.setItem('lastTransactionTime', 'Just now');
            } else {
                localStorage.setItem('sessionRevenue', '0');
            }
        </script>
    </div>

</body>
</html>
