<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-display { display: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- 1. LOGIN SCREEN -->
    <section id="login-section" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-xl">
            <div class="text-center mb-8">
                <div class="text-4xl mb-4">🔒</div>
                <h1 class="text-xl font-bold text-slate-200">Restricted Area</h1>
            </div>
            <form onsubmit="checkLogin(event)">
                <!-- Use 'id="u"' explicitly because I gave it that ID below -->
                <input type="text" id="u" placeholder="ID" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 mb-4 text-sm outline-none focus:border-indigo-500">
                <input type="password" id="p" placeholder="Secret Key" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 mb-6 text-sm outline-none focus:border-indigo-500">
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg text-sm font-bold transition">Login</button>
            </form>
            <p id="err" class="text-red-500 text-xs text-center mt-4 hidden">Wrong password.</p>
        </div>
    </section>

    <!-- 2. ADMIN DASHBOARD (Hidden by default) -->
    <div id="admin-dashboard" class="hidden-display bg-slate-950 min-h-screen">
        <!-- Nav Bar -->
        <div class="flex justify-between items-center p-6 border-b border-slate-800">
            <div class="font-bold text-indigo-400">NEXUS.AI <span class="text-white">ADMIN</span></div>
            <!-- DO NOT CLICK THIS BUTTON -->
            <button onclick="location.reload()" class="bg-red-900/50 text-red-400 border border-red-900 text-xs px-3 py-1 rounded hover:bg-red-900">Log Out (Refresh)</button>
        </div>

        <!-- Content -->
        <div class="max-w-4xl mx-auto p-8">
            <div class="bg-slate-900 border border-slate-800 p-6 mb-6">
                <h2 class="text-2xl font-bold">Live Dashboard</h2>
            </div>

            <div class="bg-slate-900 border border-slate-800 p-8">
                <h3 class="text-lg font-bold text-indigo-400 mb-4">Real-Time Stats</h3>
                
                <div class="flex justify-between items-center py-4 border-b border-slate-800">
                    <span class="text-slate-400">Revenue</span>
                    <span id="revenue" class="text-2xl font-bold text-white">$142,850</span>
                </div>

                 <div class="flex justify-between items-center py-4">
                    <span class="text-slate-400">Leads</span>
                    <span class="text-2xl font-bold text-white">142</span>
                </div>
            </div>

            <a href="index.html" class="mt-8 block text-center text-slate-500 text-sm hover:text-white">Return to Client Site</a>
        </div>
    </div>

    <script>
        function checkLogin(e) {
            e.preventDefault(); // Prevents page reload on submit
            
            const id = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            const err = document.getElementById('err');
            const loginSec = document.getElementById('login-section');
            const adminDash = document.getElementById('admin-dashboard');

            // Correct credentials
            if(id === "admin" && pass === "admin123") {
                // HIDE LOGIN
                loginSec.classList.add('hidden-display');
                // SHOW ADMIN
                adminDash.classList.remove('hidden-display');
            } else {
                // SHOW ERROR
                err.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
