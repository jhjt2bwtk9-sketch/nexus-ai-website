<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexusAI - Admin Security</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden-online { display: none !important; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">

    <!-- 1. LOGIN SCREEN -->
    <!-- I made sure this Div has an ID that IS the login section -->
    <div id="login-screen" class="min-h-screen flex items-center justify-center px-4">
        <div class="bg-slate-900 border border-slate-800 p-8 rounded-2xl w-full max-w-md shadow-xl">
            <div class="text-center mb-8">
                <div class="text-4xl mb-4">🔒</div>
                <h1 class="text-xl font-bold text-slate-200">Restricted Access</h1>
                <p class="text-slate-500 text-xs mt-2">Authorized personnel only</p>
            </div>
            
            <!-- FORM START -->
            <form id="login-form">
                <!-- ID="u" (User) -->
                <input type="text" id="u" placeholder="ID" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 mb-4 text-sm outline-none focus:border-indigo-500">
                
                <!-- ID="p" (Password) -->
                <input type="password" id="p" placeholder="Secret Key" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-4 py-3 mb-6 text-sm outline-none focus:border-indigo-500">
                
                <!-- On click: RETURN checkLogin(event) -->
                <button type="button" onclick="checkLogin(event)" class="w-full bg-indigo-600 hover:bg-indigo-500 py-3 rounded-lg text-sm font-bold transition">Login</button>
            </form>
            
            <!-- Error Message -->
            <p id="err" class="text-red-500 text-xs text-center mt-4 hidden">Wrong Password.</p>
        </div>
    </div>

    <!-- 2. ADMIN DASHBOARD -->
    <div id="admin-dashboard" class="hidden-online bg-slate-950 min-h-screen">
        <div class="flex justify-between items-center p-6 border-b border-slate-800">
            <div class="font-bold text-indigo-400">NEXUS.AI <span class="text-white">ADMIN</span></div>
            <button onclick="logout()" class="bg-red-900/50 text-red-400 border border-red-900 text-xs px-3 py-1 rounded">Log Out</button>
        </div>

        <div class="max-w-4xl mx-auto p-8">
            <div class="bg-slate-900 border border-slate-800 p-6">
                <h2 class="text-2xl font-bold">Live Dashboard</h2>
                <h3 class="text-lg font-bold text-indigo-400 mt-2">Real-Time Stats</h3>
                
                <div class="flex justify-between items-center py-4 border-b border-slate-800 border-dashed">
                    <span class="text-slate-400">Revenue</span>
                    <span id="revenue" class="text-2xl font-bold text-white">$142,850</span>
                </div>

                 <div class="flex justify-between items-center py-4">
                    <span class="text-slate-400">Leads</span>
                    <span class="text-2xl font-bold text-white">142</span>
                </div>
            </div>

            <a href="index.html" class="mt-8 block text-center text-slate-400 text-sm hover:text-white">Return to Client Site</a>
        </div>
    </div>

    <!-- SCRIPT: Placed at the very end to prevent loading errors -->
    <script>
        // "Return" forces the function to block the Reload
        function checkLogin(e) {
            e.preventDefault(); // Stops refresh (mostly)
            
            const id = document.getElementById('u').value;
            const pass = document.getElementById('p').value;
            const err = document.getElementById('err');
            const loginScreen = document.getElementById('login-screen');
            const adminDash = document.getElementById('admin-dashboard');

            if(id === "admin" && pass === "admin123") {
                // Hide Login
                loginScreen.classList.add('hidden-online');
                // Show Admin
                adminDash.classList.remove('hidden-online');
            } else {
                err.classList.remove('hidden');
            }
        }

        function logout() {
            location.reload();
        }
    </script>

</body>
</html>
